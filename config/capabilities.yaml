# Vikhyath AI Engineering OS — Capability Registry
# Machine-readable registry of all external capabilities
# Version: 1.0.1

capabilities:

  ecc:
    source: affaan-m/ECC
    role: engineering-foundation
    priority: 100
    ref: ca185ef5f7667078a1e70a763bd3a9c71c48acf0
    license: MIT
    activation:
      - engineering
      - implementation
      - testing
      - review
      - planning
      - verification
      - security-practices
    hosts:
      codex:
        supported: true
        integration: plugin
        install: "codex plugin marketplace add affaan-m/ECC && codex plugin install ecc@ecc-marketplace"
      antigravity:
        supported: true
        integration: skills
        notes: "Uses .agents/ directory structure"
      claude:
        supported: true
        integration: plugin
        install: "claude plugin install affaan-m/ECC"
    provides:
      - engineering-workflows
      - planning-methodology
      - implementation-discipline
      - testing-workflows
      - code-review
      - verification-loops
      - security-scanning
      - production-readiness
      - hooks
      - commands
      - agents
      - skills

