# codebase/impact-analysis — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Impact analysis
description: Affected-file and dependency impact of a change (graph reverse traversal)
intent_tags: [impact, affected, what breaks, dependency, blast radius]
origin: mixed
runtime_type: python-isolated
requires_network: false
requires_browser: none
requires_codebase_analysis: true
context_level: L2
priority: 60
security_class: local-exec
cache_strategy: project
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: [affected-file list produced, unresolved edges reported as UNKNOWN]
dependencies: [codebase/repository-understanding]
related_capabilities: []
conflicts: []
fallback_capability: codebase/code-search
enabled: true
