# codebase/code-search — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by vikhyath/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Code search
description: Scoped subgraph query/path/explain instead of raw file dumps
intent_tags: [where is, find, how does, trace]
origin: mixed
runtime_type: python-isolated
requires_network: false
requires_browser: none
requires_codebase_analysis: true
context_level: L1
priority: 60
security_class: local-exec
cache_strategy: project
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: ['answers cite file:line']
dependencies: [codebase/repository-understanding]
related_capabilities: []
conflicts: []
fallback_capability: null
enabled: true
