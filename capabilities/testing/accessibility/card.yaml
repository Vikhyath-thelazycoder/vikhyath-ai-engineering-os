# testing/accessibility — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by vikhyath/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Accessibility
description: Automated a11y checks (evidence, not WCAG proof)
intent_tags: [a11y test, accessibility audit]
origin: mixed
runtime_type: os-native
requires_network: false
requires_browser: none  # D-035: a11y assertions (axe/jsdom, RNTL roles/labels, lint rules), never a browser session
requires_codebase_analysis: false
context_level: L2
security_class: local-exec
cache_strategy: run
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: ['automated results recorded as evidence, not as WCAG proof']
dependencies: [design/accessibility]
related_capabilities: [design/accessibility]
conflicts: []
fallback_capability: design/accessibility
web_qa_class: CORE
enabled: true
