activation_conditions:
  mode: fallback
  when: [deterministic checks (testing/web-verification) cannot decide, or the user explicitly asks for visual inspection]
verification_requirements: [BROWSER_FALLBACK_ACTIVATED emitted with a reason, 'bounded run: headless first, visible only if needed']
dependencies: []
related_capabilities: []
conflicts: []
fallback_capability: null
web_qa_class: FALLBACK
web_qa_modes: {headless: OPTIONAL, visible: FALLBACK, screenshot: FALLBACK}  # spec §23A.13
enabled: true
