# testing/browser-exception — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by vikhyath/registry/generate.py; domain defaults come from config/priorities.yaml.
# DISABLED_BY_POLICY (D-035): no bundled files, never routed. It documents the only browser path: an explicit, logged,
# per-project exception that the user operates; screenshots never enter model context.
name: Browser exception
description: Browser/visual verification is disabled by policy; an explicit user request is recorded as a logged per-project exception instead
intent_tags: []
origin: os-native
runtime_type: os-native
requires_network: false
requires_browser: none
requires_codebase_analysis: false
context_level: L1
security_class: local-exec
cache_strategy: none
activation_conditions:
  mode: explicit
  when: ['never by routing; only `vikhyath verify exception` after local checks are insufficient, no equivalent test exists and the user explicitly asked (config/verification.yaml)']
verification_requirements: [BROWSER_EXCEPTION_REQUESTED event with the reason local verification was insufficient, no screenshot in model context]
dependencies: []
related_capabilities: [testing/local-verification]
conflicts: []
fallback_capability: null
web_qa_class: DISABLED_BY_POLICY
web_qa_modes: {headless: DISABLED_BY_POLICY, visible: DISABLED_BY_POLICY, screenshot: DISABLED_BY_POLICY, chrome_devtools: DISABLED_BY_POLICY}
runtime_status: DISABLED_BY_POLICY
enabled: false
