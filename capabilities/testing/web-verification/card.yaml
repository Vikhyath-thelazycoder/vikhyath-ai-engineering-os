# testing/web-verification — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by vikhyath/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Web verification
description: "Local-first ladder: build, types, lint, unit/integration, HTTP/API, DOM/state, console/network capture (\xA723A)"
intent_tags: [verify, check whether, works, flow, login, checkout, qa]
origin: mixed
runtime_type: os-native
requires_network: local-only
requires_browser: none
requires_codebase_analysis: true
context_level: L2
security_class: local-exec
cache_strategy: run
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: ['deterministic ladder run (build, types, lint, tests, HTTP/DOM) with results recorded', no browser started unless the ladder cannot decide]
dependencies: []
related_capabilities: [testing/strategy]
conflicts: []
fallback_capability: testing/browser-fallback
web_qa_class: CORE
enabled: true
