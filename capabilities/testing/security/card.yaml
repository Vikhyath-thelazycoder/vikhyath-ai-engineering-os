# testing/security — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by vikhyath/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Security
description: Authn/authz, input validation, request and dependency checks
intent_tags: [security test, pentest, auth test]
origin: mixed
runtime_type: os-native
requires_network: local-only
requires_browser: none
requires_codebase_analysis: true
context_level: L2
priority: 85
