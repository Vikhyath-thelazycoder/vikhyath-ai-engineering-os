# observability/risk-detection — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Risk detection
description: Declarative risky-command/injection/exfiltration rules over OS events
intent_tags: []
origin: mixed
runtime_type: os-native
