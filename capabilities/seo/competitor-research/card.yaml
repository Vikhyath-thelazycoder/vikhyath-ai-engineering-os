# seo/competitor-research — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Competitor research
description: Competitor discovery, matrices, gap analyses
intent_tags: [competitor, competitors]
origin: bundled
runtime_type: python-isolated
requires_network: true
requires_browser: fallback
requires_codebase_analysis: false
context_level: L2
security_class: network
cache_strategy: run
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: [competitor set and comparison criteria stated, findings labelled FACT / OBSERVATION / INFERENCE / HYPOTHESIS / UNKNOWN]
dependencies: [seo/runtime]
related_capabilities: [seo/keyword-research]
conflicts: []
fallback_capability: null
enabled: true
