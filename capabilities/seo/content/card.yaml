# seo/content — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Content
description: Content quality, E-E-A-T, content gaps
intent_tags: [content gap, content quality, eeat]
origin: bundled
runtime_type: none
requires_network: true
requires_browser: none
requires_codebase_analysis: false
context_level: L2
security_class: network
cache_strategy: run
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: [gaps cite compared pages or queries, findings labelled FACT / OBSERVATION / INFERENCE / HYPOTHESIS / UNKNOWN]
dependencies: []
related_capabilities: []
conflicts: []
fallback_capability: null
enabled: true
