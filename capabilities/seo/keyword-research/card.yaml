# seo/keyword-research — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Keyword research
description: Discovery, intent, clustering, keyword-to-page map
intent_tags: [keyword, search intent]
origin: bundled
runtime_type: none
requires_network: true
requires_browser: none
requires_codebase_analysis: false
context_level: L2
security_class: network
cache_strategy: run
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: [keyword-to-page map with intent per keyword, findings labelled FACT / OBSERVATION / INFERENCE / HYPOTHESIS / UNKNOWN]
dependencies: []
related_capabilities: [seo/content]
conflicts: []
fallback_capability: null
enabled: true
