# seo/backlinks-reputation — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by vikhyath/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Backlinks reputation
description: Backlink audit/strategy, reputation evidence
intent_tags: [backlink, reputation, digital pr]
origin: bundled
runtime_type: python-isolated
requires_network: true
requires_browser: none
requires_codebase_analysis: false
context_level: L2
security_class: network
cache_strategy: run
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: [link and reputation claims cite their data source, findings labelled FACT / OBSERVATION / INFERENCE / HYPOTHESIS / UNKNOWN]
dependencies: [seo/runtime]
related_capabilities: []
conflicts: []
fallback_capability: null
enabled: true
