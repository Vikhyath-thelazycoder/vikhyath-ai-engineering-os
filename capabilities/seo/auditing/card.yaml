# seo/auditing — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by vikhyath/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Auditing
description: Full-site audit workflow, prioritization, delivery standard
intent_tags: [seo audit, audit my website, why not ranking]
origin: bundled
runtime_type: python-isolated
requires_network: true
requires_browser: fallback
requires_codebase_analysis: false
context_level: L2
security_class: network
cache_strategy: run
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: [prioritized issues with evidence URLs, findings labelled FACT / OBSERVATION / INFERENCE / HYPOTHESIS / UNKNOWN]
dependencies: [seo/runtime, seo/evidence]
related_capabilities: [seo/technical, seo/on-page, seo/content, seo/reporting]
conflicts: []
fallback_capability: null
enabled: true
