# seo/reporting — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by vikhyath/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Reporting
description: Reports and templates
intent_tags: [seo report]
origin: bundled
runtime_type: python-isolated
requires_network: false
requires_browser: none
requires_codebase_analysis: false
context_level: L2
security_class: local-exec
cache_strategy: static
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: [every report section backed by captured data, findings labelled FACT / OBSERVATION / INFERENCE / HYPOTHESIS / UNKNOWN]
dependencies: []
related_capabilities: []
conflicts: []
fallback_capability: null
enabled: true
