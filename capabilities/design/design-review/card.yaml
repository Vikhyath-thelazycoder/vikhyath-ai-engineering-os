# design/design-review — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by vikhyath/registry/generate.py; domain defaults come from config/priorities.yaml.
name: Design review
description: Design review and consultation method, specialist design roles
intent_tags: [design review, critique, audit design]
origin: bundled
runtime_type: none
requires_network: false
requires_browser: none  # D-035: gstack's screenshot-driven design-review excluded; review works from code, tokens and states
requires_codebase_analysis: false
context_level: L2
security_class: read-only
cache_strategy: static
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: [findings reference criteria and the screens/states reviewed]
dependencies: [design/visual-quality]
related_capabilities: [design/accessibility]
conflicts: []
fallback_capability: design/visual-quality
enabled: true
