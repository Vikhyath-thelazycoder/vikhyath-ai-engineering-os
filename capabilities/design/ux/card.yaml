# design/ux — capability card (spec §13). Provenance fields (sources, commit, license, size) are generated
# by agylite/registry/generate.py; domain defaults come from config/priorities.yaml.
name: UX
description: UX laws, flows, forms, state coverage
intent_tags: [ux, usability, flow, form, onboarding flow, empty state]
origin: bundled
runtime_type: none
requires_network: false
requires_browser: none
requires_codebase_analysis: false
context_level: L2
security_class: read-only
cache_strategy: static
activation_conditions:
  when: [request matches intent_tags or a routing rule selects this capability]
verification_requirements: ['empty, loading, error and success states covered']
dependencies: []
related_capabilities: []
conflicts: []
fallback_capability: null
enabled: true
